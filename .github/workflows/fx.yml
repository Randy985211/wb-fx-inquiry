name: fx-inquiry
# 银行询价（public 仓库 · schedule 驱动版 v6）
# v5 的"链条接力"已废除：配额报错时 main 崩溃仍无条件接力，导致每15秒刷一棒、
# 每棒重复 sheet_read，把腾讯文档 MCP 配额打爆(400007)，10-12 下午全部时点漏写。
# v6：纯 schedule（每15分钟，北京 09:00-18:00）+ 本机每30分钟保活点火。
#     全天约 40 棒，脚本内无窗口即退出，无 sleep，无接力 → 配额消耗降至 1/60。
# 幂等：块已存在且完整→跳过；窗口=[时点-10分,+25分]，过点不补（宁缺毋假）。
# 表格倒序：最新时点永远在最上面。
on:
  schedule:
    - cron: "*/15 1-10 * * 1-5"   # UTC 01:00-10:45 = 北京 09:00-18:45，覆盖全部11个时点
  workflow_dispatch:
    inputs:
      slot:
        description: "时点(0940/1000/1030/1100/1130/1400/1500/1530/1615/1650/1730)，留空自动判定"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: fx-inquiry
  cancel-in-progress: false   # 同一时刻只跑一棒，避免并发写表

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Run fx inquiry
        env:
          TDOC_TOKEN: ${{ secrets.TDOC_TOKEN }}
          FX_SLOT: ${{ github.event.inputs.slot }}
        run: python3 forex/forex_cloud.py
